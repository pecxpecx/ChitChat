syntax = "proto3";

package chitchat;
option go_package = "chitchat/grpc";

service ChitChat {
  rpc Chat (stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  string client_id = 1;
  string message = 2; 
  uint64 lamport_timestamp = 3;
  
  enum EventType {
    JOIN = 0;
    PUBLISH = 1;
    LEAVE = 2;
  }
  EventType event = 4;
}

message ServerMessage {
  string message = 1; 
  uint64 lamport_timestamp = 2;
}